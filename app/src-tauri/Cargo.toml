[package]
name = "relaudio-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "relaudio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
relaudio-core = { path = "../../crates/relaudio-core" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
