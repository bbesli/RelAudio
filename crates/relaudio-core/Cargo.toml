[package]
name = "relaudio-core"
version.workspace = true
edition.workspace = true

[dependencies]
relaudio-proto.workspace = true
thiserror.workspace = true
log.workspace = true
mdns-sd = { version = "0.21", default-features = false }
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Eşleştirme imzası. Elle SHA-256 yazmak yerine tek dosyalık, bağımlılıksız
# bir uygulama; `getrandom` zaten Tauri üzerinden ağaçta.
hmac-sha256 = "1"
getrandom = "0.2"
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2"
libpulse-simple-binding = "2"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24"
