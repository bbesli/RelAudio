[workspace]
resolver = "2"
members = [
    "crates/relaudio-proto",
    "crates/relaudio-core",
    "crates/relaudio-cli",
]
# Tauri uygulaması kendi bağımlılık ağacını yönetir; spike atılacak kod.
exclude = ["app/src-tauri", "spike/win-loopback"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
relaudio-proto = { path = "crates/relaudio-proto" }
relaudio-core = { path = "crates/relaudio-core" }
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
